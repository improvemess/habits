name: Build APK

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write the cache from dev, so that PR builds don't evict it.
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      # Optional: with a fixed debug keystore every CI build has the same
      # signature, so new APKs can be installed over older ones without
      # uninstalling first. Without the secret, a random key is generated.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Build debug APK
        run: ./gradlew --stacktrace :uhabits-android:assembleDebug

      - name: Prepare artifact
        id: prepare
        run: |
          VERSION=$(grep versionName uhabits-android/build.gradle.kts | sed -e 's/.*"\([^"]*\)".*/\1/')
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          NAME="loop-${VERSION}-debug-${SHORT_SHA}"
          mkdir -p dist
          cp uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk "dist/${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # archive: false uploads the APK as-is instead of zipping it. Only a
      # single file is allowed; its file name becomes the artifact name.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.prepare.outputs.name }}.apk
          archive: false
          retention-days: 30
          if-no-files-found: error
