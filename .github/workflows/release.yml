name: Release

# Releases entstehen auf main: Feature-PRs landen per Squash auf dev
# (Commit-Titel = PR-Titel), ein Release-PR dev → main wird als Merge-Commit
# gemergt (Ruleset auf main erlaubt nur das). semantic-release liest die
# einzelnen Conventional-Commit-Titel von dev, leitet daraus die Version ab,
# aktualisiert CHANGELOG.md und versionName/versionCode, baut die APK und
# veröffentlicht sie als GitHub-Release. Danach wird main nach dev
# zurückgeführt. Konfiguration: .releaserc.json, Build: tools/release/prepare.sh,
# Rückführung: tools/release/back-merge.sh
#
# Titel des Release-PRs z. B. "chore(release): dev → main". Er wird zum Titel
# des Merge-Commits und darf selbst kein Release auslösen (kein feat/fix).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Der Release-Commit selbst trägt [skip ci]; das hier ist nur die Absicherung.
    # workflow_dispatch nur auf main, sonst liefe die Rückführung von einem
    # anderen Branch aus.
    if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      # Gepusht wird per Deploy-Key: Er darf die Rulesets auf main und dev
      # (Pflicht-Checks, nur per PR) umgehen, GITHUB_TOKEN dagegen nicht.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 fehlt."
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Semantic release
        id: release
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 26
          extra_plugins: |
            @semantic-release/changelog@7
            @semantic-release/exec@7
            @semantic-release/git@11
            conventional-changelog-conventionalcommits@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Läuft auch ohne neues Release (z. B. nur chore/docs seit dem letzten),
      # damit dev den Merge-Commit von main ebenfalls enthält. Der
      # Rückführungs-Commit trägt bewusst keinen Skip-CI-Marker, siehe Skript.
      - name: Merge main back into dev
        env:
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: 32174276+semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: 32174276+semantic-release-bot@users.noreply.github.com
        run: tools/release/back-merge.sh main dev

      - name: Summary
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          CERT=$("$APKSIGNER" verify --print-certs dist/*.apk | grep 'certificate SHA-256')
          {
            echo "### Release ${{ steps.release.outputs.new_release_git_tag }}"
            echo "**Signatur:** \`${CERT##*: }\`"
          } >> "$GITHUB_STEP_SUMMARY"
