name: TEMP release dry run (#127)

# Nur zum einmaligen Prüfen von prepare.sh mit dem Release-Schlüssel auf
# diesem Branch. Wird vor dem Merge wieder entfernt. Veröffentlicht nichts.
on:
  push:
    branches: [build/127-production-apk]

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          LOOP_KEY_STORE_BASE64: ${{ secrets.LOOP_KEY_STORE_BASE64 }}
        run: |
          echo "$LOOP_KEY_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "LOOP_KEY_STORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: prepare.sh 2.99.0
        env:
          LOOP_KEY_ALIAS: ${{ secrets.LOOP_KEY_ALIAS }}
          LOOP_KEY_PASSWORD: ${{ secrets.LOOP_KEY_PASSWORD }}
          LOOP_STORE_PASSWORD: ${{ secrets.LOOP_STORE_PASSWORD }}
        run: tools/release/prepare.sh 2.99.0
      - name: Result
        run: |
          ls -la dist/
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --verbose --print-certs dist/*.apk | grep -E "Verified using|certificate SHA-256|certificate DN"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt
          "$AAPT" dump badging dist/*.apk | grep -E "^package:|application-label:"
          head -3 dist/*-mapping.txt
