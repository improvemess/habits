name: Quality Gates

# No paths-ignore: "Quality gate" is a required check on dev and main, so the
# workflow has to run for every pull request, otherwise the check would stay
# pending forever. Instead the job "Changes" (tools/ci/changes.sh) decides from
# the changed files which jobs are needed, and the others are skipped: a pull
# request that only changes documentation runs none of them, one that only
# changes uhabits-android skips the core job. "Quality gate" accepts a skipped
# job only if "Changes" did not ask for it. Pushes to main, release pull
# requests into main and manual runs always run every job.
#
# Der Lauf auf dev füllt die Caches für die PRs: GitHub-Caches gelten pro
# Branch, PRs dürfen nur die von dev lesen. setup-gradle speichert den
# Gradle-Build-Cache nur auf dev (in PRs nur lesend); ohne diesen Lauf fänden
# PRs keine Debug-Kompilate im Cache.
#
# Der Lauf auf main prüft den Stand, aus dem das Release gebaut wird. Er liest
# den Cache von dev nur (main ist nicht der Standard-Branch) und stellt die
# Debug-APK des Release-Stands als Artefakt bereit.
#
# workflow_dispatch läuft auch für Commits mit Skip-CI-Marker; damit lässt sich
# der Pflicht-Check für einen solchen Commit von Hand nachholen.
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Unabhängige Prüfungen laufen parallel; "Quality gate" sammelt die Ergebnisse
# und stellt nur bei Erfolg die Debug-APK bereit:
#
#             ┌──> ktlint ──────────────────────────────┐
#             ├──> core ────────────────────────────────┤
#   changes ──┼──> unit-tests ──────────────────────────┼──> quality-gate (+ APK)
#             ├──> lint ────────────────────────────────┤
#             ├──> release ─────────────────────────────┤
#             └──> assemble ──┬─────────────────────────┤
#                             └──> instrumented ×3 ─────┘   (shards, one emulator each)
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ktlint: ${{ steps.filter.outputs.ktlint }}
      core: ${{ steps.filter.outputs.core }}
      android: ${{ steps.filter.outputs.android }}
      assemble: ${{ steps.filter.outputs.assemble }}
      instrumented: ${{ steps.filter.outputs.instrumented }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      # Full history without file contents: enough for git diff --name-only.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Decide which jobs are needed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [[ $EVENT == pull_request && $PR_BASE_REF != main ]]; then
            ARGS=("$PR_BASE_SHA" "$PR_HEAD_SHA")
          elif [[ $EVENT == push && $REF != refs/heads/main ]]; then
            ARGS=("$PUSH_BEFORE" "$PUSH_AFTER")
          else
            # main, release pull requests and manual runs: everything.
            ARGS=(--all)
          fi
          FLAGS=$(tools/ci/changes.sh "${ARGS[@]}")
          echo "$FLAGS" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Jobs needed"
            echo
            echo '```'
            echo "$FLAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ktlint:
    name: Code style (ktlint)
    needs: [changes]
    if: needs.changes.outputs.ktlint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew --stacktrace ktlintCheck

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/'

  core:
    name: Core (build & tests)
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # JS-Tests laufen über Karma mit ChromeHeadless (auf ubuntu-latest vorinstalliert)
      - name: Build and test uhabits-core
        run: ./gradlew --stacktrace kotlinUpgradeYarnLock :uhabits-core:build -x ktlintCheck

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: core-reports
          path: uhabits-core/build/reports/
          if-no-files-found: ignore

  # Baut nur die APKs, damit der Emulator-Job so früh wie möglich starten kann.
  # Unit-Tests und Lint laufen in eigenen Jobs parallel dazu.
  assemble:
    name: Android (assemble)
    needs: [changes]
    if: needs.changes.outputs.assemble == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk-name: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: Mit festem Debug-Keystore haben alle CI-Builds dieselbe Signatur,
      # neue APKs lassen sich also ohne Deinstallation über alte installieren.
      # Gradle liest den Pfad aus DEBUG_KEYSTORE (siehe uhabits-android/build.gradle.kts);
      # ohne das Secret wird ein zufälliger Schlüssel erzeugt.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Assemble
        run: >-
          ./gradlew --stacktrace
          :uhabits-android:assembleDebug
          :uhabits-android:assembleDebugAndroidTest

      - name: Name debug APK
        id: apk
        run: |
          VERSION=$(sed -n -E 's/^ *versionName = "([^"]+)".*/\1/p' uhabits-android/build.gradle.kts)
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          APP_ID=$(sed -n -E 's/^ *applicationId = "([^"]+)".*/\1/p' uhabits-android/build.gradle.kts)
          # Paket-ID des Debug-Builds (Endung .debug, #126) und Version
          NAME="${APP_ID}.debug.${VERSION}-${SHORT_SHA}.apk"
          mkdir -p dist
          cp uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # Bleibt der Fingerprint über Builds gleich, lassen sich die APKs überinstallieren.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          CERT=$("$APKSIGNER" verify --print-certs "dist/${{ steps.apk.outputs.name }}" | grep 'certificate SHA-256')
          echo "$CERT"
          echo "**Signatur:** \`${CERT##*: }\`" >> "$GITHUB_STEP_SUMMARY"

      # Zwischenablage; bereitgestellt wird die APK erst vom Job "quality-gate".
      - name: Stash debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-unverified
          path: dist/${{ steps.apk.outputs.name }}
          retention-days: 1
          if-no-files-found: error

      # Für den Job "instrumented", damit er nicht noch einmal bauen muss.
      - name: Stash APKs for instrumented tests
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-apks
          path: |
            uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk
            uhabits-android/build/outputs/apk/androidTest/debug/uhabits-android-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error

  unit-tests:
    name: Android (unit tests)
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace :uhabits-android:testDebugUnitTest

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            uhabits-android/build/reports/tests/
            uhabits-android/build/test-results/
          if-no-files-found: ignore

  lint:
    name: Android (lint)
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew --stacktrace :uhabits-android:lintDebug

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: uhabits-android/build/reports/
          if-no-files-found: ignore

  # Instrumentation-Tests (size medium + large), verteilt auf mehrere Emulatoren
  # in der Konfiguration, auf die die Referenzbilder der View-Tests ausgelegt
  # sind (docs/TEST.md: Nexus 4, en-US). Fehlgeschlagene Tests bekommen einen
  # zweiten Versuch; was nur so grün wird, erscheint als Warnung.
  instrumented:
    name: Android (instrumented tests, shard ${{ matrix.shard }})
    needs: [changes, assemble]
    if: needs.changes.outputs.instrumented == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Die Tests werden per AndroidJUnitRunner-Sharding auf mehrere Emulatoren
    # verteilt (tools/ci/run-instrumented-tests.sh). Bei Änderung der Anzahl
    # auch NUM_SHARDS anpassen.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      NUM_SHARDS: 3
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch APKs
        uses: actions/download-artifact@v8
        with:
          name: instrumented-apks
          path: apks

      # Hardwarebeschleunigung für den Emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Kalter Start ohne Snapshot-Cache: Der Snapshot (2,2 GB) zu laden dauerte
      # länger, als er beim Booten sparte.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 4
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-boot-anim -no-snapshot
          script: >-
            tools/ci/run-instrumented-tests.sh
            apks/debug/uhabits-android-debug.apk
            apks/androidTest/debug/uhabits-android-debug-androidTest.apk
            instrumented-output

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-results-${{ matrix.shard }}
          path: instrumented-output/
          if-no-files-found: ignore

  # Release-Variante mit R8 (Minify), wie F-Droid sie baut: unsigniert, ohne
  # LOOP_KEY_*. Baut sie und prüft sie auf dem Emulator mit einem Smoke-Test
  # (Start + monkey), da die Instrumentation-Tests nur die Debug-Variante
  # abdecken (#108). Läuft parallel zu den übrigen Jobs.
  release:
    name: Android (release build + smoke test)
    needs: [changes]
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble release (R8)
        run: ./gradlew --stacktrace :uhabits-android:assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 4
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-boot-anim -no-snapshot
          script: >-
            tools/ci/release-smoke-test.sh
            uhabits-android/build/outputs/apk/release/uhabits-android-release-unsigned.apk
            release-smoke-output

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-results
          path: |
            release-smoke-output/
            !release-smoke-output/*.keystore
            uhabits-android/build/outputs/mapping/release/
          if-no-files-found: ignore

  quality-gate:
    name: Quality gate
    if: always()
    needs: [changes, ktlint, core, assemble, unit-tests, lint, instrumented, release]
    runs-on: ubuntu-latest
    steps:
      # A job that "Changes" asked for must have succeeded; any other job must
      # have been skipped. "Changes" itself must always succeed.
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          check() { # <job> <needed: true|false>
            local result
            result=$(jq -r --arg job "$1" '.[$job].result' <<<"$NEEDS")
            echo "$1: $result (needed: $2)"
            if [[ $2 == true && $result != success ]] \
              || [[ $2 != true && $result != skipped && $result != success ]]; then
              FAILED=true
            fi
          }
          FAILED=false
          check changes true
          check ktlint "${{ needs.changes.outputs.ktlint }}"
          check core "${{ needs.changes.outputs.core }}"
          check assemble "${{ needs.changes.outputs.assemble }}"
          check unit-tests "${{ needs.changes.outputs.android }}"
          check lint "${{ needs.changes.outputs.android }}"
          check instrumented "${{ needs.changes.outputs.instrumented }}"
          check release "${{ needs.changes.outputs.release }}"
          if [[ $FAILED == true ]]; then
            echo "::error::At least one quality gate failed."
            exit 1
          fi

      # Only when the debug APK was built (not for e.g. documentation only).
      - name: Fetch debug APK
        if: needs.assemble.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: debug-apk-unverified
          path: dist

      # archive: false lädt die APK direkt hoch statt als ZIP. Nur eine einzelne
      # Datei ist erlaubt; ihr Dateiname wird zum Artifact-Namen.
      - name: Publish debug APK
        if: needs.assemble.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ needs.assemble.outputs.apk-name }}
          archive: false
          retention-days: 30
          if-no-files-found: error
