name: Quality Gates

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  ktlint:
    name: Code style (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/'

  core:
    name: Core (build & tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # JS-Tests laufen über Karma mit ChromeHeadless (auf ubuntu-latest vorinstalliert)
      - name: Build and test uhabits-core
        run: ./gradlew kotlinUpgradeYarnLock :uhabits-core:build -x ktlintCheck --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: uhabits-core/build/reports/
          if-no-files-found: ignore

  android:
    name: Android (unit tests, lint, assemble)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Ein Gradle-Aufruf spart Konfigurationszeit; --continue meldet alle Fehler auf einmal.
      - name: Unit tests, lint, assemble
        run: >-
          ./gradlew --continue --stacktrace
          :uhabits-android:testDebugUnitTest
          :uhabits-android:lintDebug
          :uhabits-android:assembleDebug
          :uhabits-android:assembleDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            uhabits-android/build/reports/
            uhabits-android/build/test-results/
          if-no-files-found: ignore

  quality-gate:
    name: Quality gate
    if: always()
    needs: [ktlint, core, android]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "ktlint:  ${{ needs.ktlint.result }}"
          echo "core:    ${{ needs.core.result }}"
          echo "android: ${{ needs.android.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::Mindestens ein Quality Gate ist fehlgeschlagen."
            exit 1
          fi

  # Läuft nur, wenn das Quality Gate grün ist.
  apk:
    name: Build debug APK
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: Mit festem Debug-Keystore haben alle CI-Builds dieselbe Signatur,
      # neue APKs lassen sich also ohne Deinstallation über alte installieren.
      # Ohne das Secret wird ein zufälliger Schlüssel erzeugt.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Build debug APK
        run: ./gradlew --stacktrace :uhabits-android:assembleDebug

      - name: Prepare APK
        id: prepare
        run: |
          VERSION=$(grep versionName uhabits-android/build.gradle.kts | sed -e 's/.*"\([^"]*\)".*/\1/')
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          NAME="loop-${VERSION}-debug-${SHORT_SHA}.apk"
          mkdir -p dist
          cp uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk "dist/${NAME}"
          echo "path=dist/${NAME}" >> "$GITHUB_OUTPUT"

      # archive: false lädt die APK direkt hoch statt als ZIP. Nur eine einzelne
      # Datei ist erlaubt; ihr Dateiname wird zum Artifact-Namen.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare.outputs.path }}
          archive: false
          retention-days: 30
          if-no-files-found: error
