name: Quality Gates

# Kein paths-ignore: "Quality gate" ist Pflicht-Check auf dev und muss daher
# bei jedem PR laufen, sonst bliebe er dauerhaft ausstehend.
#
# Der Lauf auf dev füllt die Caches für die PRs: GitHub-Caches gelten pro
# Branch, PRs dürfen nur die von dev lesen. setup-gradle speichert den
# Gradle-Build-Cache nur auf dev (in PRs nur lesend), und der AVD-Snapshot wird
# unten ebenfalls nur auf dev gespeichert.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Unabhängige Prüfungen laufen parallel; "Quality gate" sammelt die Ergebnisse
# und stellt nur bei Erfolg die Debug-APK bereit:
#
#   ktlint ──────────────────────────────┐
#   core ────────────────────────────────┤
#   unit-tests ──────────────────────────┼──> quality-gate (+ APK)
#   lint ────────────────────────────────┤
#   assemble ──┬─────────────────────────┤
#              └──> instrumented ×3 ─────┘   (Shards, je ein Emulator)
jobs:
  ktlint:
    name: Code style (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew --stacktrace ktlintCheck

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/'

  core:
    name: Core (build & tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # JS-Tests laufen über Karma mit ChromeHeadless (auf ubuntu-latest vorinstalliert)
      - name: Build and test uhabits-core
        run: ./gradlew --stacktrace kotlinUpgradeYarnLock :uhabits-core:build -x ktlintCheck

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: core-reports
          path: uhabits-core/build/reports/
          if-no-files-found: ignore

  # Baut nur die APKs, damit der Emulator-Job so früh wie möglich starten kann.
  # Unit-Tests und Lint laufen in eigenen Jobs parallel dazu.
  assemble:
    name: Android (assemble)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk-name: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: Mit festem Debug-Keystore haben alle CI-Builds dieselbe Signatur,
      # neue APKs lassen sich also ohne Deinstallation über alte installieren.
      # Gradle liest den Pfad aus DEBUG_KEYSTORE (siehe uhabits-android/build.gradle.kts);
      # ohne das Secret wird ein zufälliger Schlüssel erzeugt.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Assemble
        run: >-
          ./gradlew --stacktrace
          :uhabits-android:assembleDebug
          :uhabits-android:assembleDebugAndroidTest

      - name: Name debug APK
        id: apk
        run: |
          VERSION=$(grep versionName uhabits-android/build.gradle.kts | sed -e 's/.*"\([^"]*\)".*/\1/')
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          NAME="loop-${VERSION}-debug-${SHORT_SHA}.apk"
          mkdir -p dist
          cp uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # Bleibt der Fingerprint über Builds gleich, lassen sich die APKs überinstallieren.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          CERT=$("$APKSIGNER" verify --print-certs "dist/${{ steps.apk.outputs.name }}" | grep 'certificate SHA-256')
          echo "$CERT"
          echo "**Signatur:** \`${CERT##*: }\`" >> "$GITHUB_STEP_SUMMARY"

      # Zwischenablage; bereitgestellt wird die APK erst vom Job "quality-gate".
      - name: Stash debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-unverified
          path: dist/${{ steps.apk.outputs.name }}
          retention-days: 1
          if-no-files-found: error

      # Für den Job "instrumented", damit er nicht noch einmal bauen muss.
      - name: Stash APKs for instrumented tests
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-apks
          path: |
            uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk
            uhabits-android/build/outputs/apk/androidTest/debug/uhabits-android-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error

  unit-tests:
    name: Android (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace :uhabits-android:testDebugUnitTest

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            uhabits-android/build/reports/tests/
            uhabits-android/build/test-results/
          if-no-files-found: ignore

  lint:
    name: Android (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew --stacktrace :uhabits-android:lintDebug

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: uhabits-android/build/reports/
          if-no-files-found: ignore

  # Instrumentation-Tests (size medium + large), verteilt auf mehrere Emulatoren
  # in der Konfiguration, auf die die Referenzbilder der View-Tests ausgelegt
  # sind (docs/TEST.md: Nexus 4, en-US). Fehlgeschlagene Tests bekommen einen
  # zweiten Versuch; was nur so grün wird, erscheint als Warnung.
  instrumented:
    name: Android (instrumented tests, shard ${{ matrix.shard }})
    needs: [assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Die Tests werden per AndroidJUnitRunner-Sharding auf mehrere Emulatoren
    # verteilt (tools/ci/run-instrumented-tests.sh). Bei Änderung der Anzahl
    # auch NUM_SHARDS anpassen.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      NUM_SHARDS: 3
      SHARD_INDEX: ${{ matrix.shard }}
      # Gleiche Werte für Snapshot und Testlauf, sonst passt der Snapshot nicht.
      EMULATOR_API_LEVEL: 34
      EMULATOR_TARGET: google_apis
      EMULATOR_PROFILE: Nexus 4
    steps:
      - uses: actions/checkout@v4

      - name: Fetch APKs
        uses: actions/download-artifact@v8
        with:
          name: instrumented-apks
          path: apks

      # Hardwarebeschleunigung für den Emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # tools/parseInstrument.py erwartet Zeitstempel von `ts`.
      - name: Install moreutils
        run: sudo apt-get install -y --no-install-recommends moreutils

      # Frisch gebooteter AVD als Snapshot; spätere Läufe starten daraus statt
      # kalt zu booten. Bei Änderungen an der Emulator-Konfiguration (Profil,
      # Optionen) das Suffix des Schlüssels erhöhen, damit ein neuer entsteht.
      # Gespeichert wird nur auf dev (siehe "Save AVD snapshot"), damit alle PRs
      # denselben Snapshot nutzen und der 2-GB-Eintrag nicht pro PR entsteht.
      - name: Restore AVD snapshot
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API_LEVEL }}-${{ env.EMULATOR_TARGET }}-x86_64-nexus4-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: x86_64
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: echo "AVD snapshot created."

      - name: Save AVD snapshot
        if: >-
          steps.avd-cache.outputs.cache-hit != 'true'
          && github.ref == 'refs/heads/dev'
          && matrix.shard == 0
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: x86_64
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot-save
          script: >-
            tools/ci/run-instrumented-tests.sh
            apks/debug/uhabits-android-debug.apk
            apks/androidTest/debug/uhabits-android-debug-androidTest.apk
            instrumented-output

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-results-${{ matrix.shard }}
          path: instrumented-output/
          if-no-files-found: ignore

  quality-gate:
    name: Quality gate
    if: always()
    needs: [ktlint, core, assemble, unit-tests, lint, instrumented]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "ktlint:  ${{ needs.ktlint.result }}"
          echo "core:    ${{ needs.core.result }}"
          echo "assemble: ${{ needs.assemble.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "instrumented: ${{ needs.instrumented.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "::error::Mindestens ein Quality Gate ist fehlgeschlagen."
            exit 1
          fi

      - name: Fetch debug APK
        uses: actions/download-artifact@v8
        with:
          name: debug-apk-unverified
          path: dist

      # archive: false lädt die APK direkt hoch statt als ZIP. Nur eine einzelne
      # Datei ist erlaubt; ihr Dateiname wird zum Artifact-Namen.
      - name: Publish debug APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ needs.assemble.outputs.apk-name }}
          archive: false
          retention-days: 30
          if-no-files-found: error
